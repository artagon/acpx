name: Release

# Publishes the npm package. The single-executable binaries are built and
# attested separately by release-binaries.yml.
#
# Trust model, and where it differs from the binary pipeline: that workflow
# keeps the signing identity in a job that runs no repository code. This one
# cannot. npm trusted publishing derives provenance from an OIDC token minted in
# the job that holds the package, so build code and the signing identity are
# necessarily co-resident here. The mitigations that remain are the gates below
# — tag ancestry, metadata validation, a lockfile-frozen install — plus
# publishing a tarball that was attested before it left the runner.

on:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24
  PNPM_VERSION: 10.34.5

jobs:
  release:
    # DO NOT change this job back to a self-hosted runner.
    # npm trusted publishing + provenance for GitHub Actions releases
    # requires a GitHub-hosted runner, and publishing fails on self-hosted
    # environments with:
    # "Unsupported GitHub Actions runner environment: self-hosted".
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate package metadata for trusted publishing
        run: |
          node - <<'NODE'
          const { readFileSync } = require("node:fs");

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const expectedAuthor = "OpenClaw Team <dev@openclaw.ai>";
          const expectedRepoUrl = "https://github.com/openclaw/acpx";

          const normalizeRepoUrl = (value) =>
            String(value ?? "")
              .trim()
              .replace(/^git\+/, "")
              .replace(/\.git$/i, "")
              .replace(/\/+$/, "");

          const actualRepoUrl = normalizeRepoUrl(pkg?.repository?.url);
          const expectedRepoUrlNormalized = normalizeRepoUrl(expectedRepoUrl);

          const errors = [];
          if (actualRepoUrl !== expectedRepoUrlNormalized) {
            errors.push(
              `package.json repository.url must resolve to ${expectedRepoUrlNormalized}; found ${actualRepoUrl || "<missing>"}`
            );
          }
          if ((pkg?.author ?? "") !== expectedAuthor) {
            errors.push(
              `package.json author must be exactly "${expectedAuthor}"; found "${pkg?.author ?? ""}"`
            );
          }

          if (errors.length > 0) {
            for (const err of errors) {
              console.error(err);
            }
            process.exit(1);
          }

          console.log("Package metadata validated.");
          NODE

      - name: Validate release tag
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main --depth=1

          node - <<'NODE'
          const { execFileSync } = require("node:child_process");
          const { readFileSync } = require("node:fs");

          const releaseTag = process.env.RELEASE_TAG ?? "";
          const releaseSha = process.env.RELEASE_SHA ?? "";
          const semverTag = /^v\d+\.\d+\.\d+$/;

          if (!semverTag.test(releaseTag)) {
            console.error(
              `Release tags must match vX.Y.Z; received ${releaseTag || "<missing>"}.`
            );
            process.exit(1);
          }

          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const expectedTag = `v${pkg.version}`;

          if (releaseTag !== expectedTag) {
            console.error(
              `Release tag ${releaseTag} does not match package.json version ${pkg.version}; expected ${expectedTag}.`
            );
            process.exit(1);
          }

          try {
            execFileSync(
              "git",
              ["merge-base", "--is-ancestor", releaseSha, "origin/main"],
              { stdio: "ignore" }
            );
          } catch {
            console.error(
              `Tagged commit ${releaseSha} is not contained in origin/main.`
            );
            process.exit(1);
          }

          console.log(
            `Release tag ${releaseTag} matches package.json and points to a commit on origin/main.`
          );
          NODE

      - name: Ensure version is not already published
        run: |
          set -euo pipefail
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          error_log="$(mktemp)"

          if npm view "acpx@${PACKAGE_VERSION}" version >/dev/null 2>"${error_log}"; then
            echo "acpx@$PACKAGE_VERSION is already published on npm."
            exit 1
          fi

          if ! grep -Eq "E404|404 Not Found" "${error_log}"; then
            cat "${error_log}" >&2
            exit 1
          fi

          echo "Publishing acpx@$PACKAGE_VERSION"

      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run build

      # Pack before publishing so the bytes that get attested are the bytes that
      # get published. `npm publish` on its own repacks, which would leave the
      # attestation describing a tarball no one can fetch.
      - name: Pack the package
        id: pack
        run: |
          set -euo pipefail
          tarball="$(npm pack --silent)"
          if ! [[ "$tarball" =~ ^acpx-[0-9]+\.[0-9]+\.[0-9]+\.tgz$ ]]; then
            echo "::error::npm pack produced an unexpected name: '$tarball'"
            exit 1
          fi
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      # Unlike the single executable, the npm package bundles nothing: `dist/`
      # ships alone and every dependency is installed on the user's machine at
      # install time. So the honest scan target is the production dependency
      # closure, resolved from the same frozen lockfile. Most components are
      # pulled in by the bundled ACP adapters.
      #
      # Built as a production-only deploy rather than by scanning the workspace
      # lockfile, whose package snapshots also include dev dependencies.
      - name: Resolve the production dependency closure
        run: |
          set -euo pipefail
          # --ignore-scripts: this deploys untrusted dependency code, and there
          # is an OIDC token in this job. --legacy is required because this
          # workspace does not use inject-workspace-packages.
          pnpm --filter acpx deploy \
            --prod \
            --legacy \
            --ignore-scripts \
            "${RUNNER_TEMP}/prod-tree"
          # Syft's directory source catalogs JavaScript dependency manifests,
          # not pnpm's linked package store. Expose deploy's pruned lock under
          # the standard filename so only the deployed closure is cataloged.
          cp \
            "${RUNNER_TEMP}/prod-tree/node_modules/.pnpm/lock.yaml" \
            "${RUNNER_TEMP}/prod-tree/pnpm-lock.yaml"

      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: ${{ runner.temp }}/prod-tree
          format: cyclonedx-json
          output-file: ${{ steps.pack.outputs.tarball }}.cdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Check the SBOM describes something
        env:
          SBOM: ${{ steps.pack.outputs.tarball }}.cdx.json
        run: |
          set -euo pipefail
          # An empty document would attest cleanly and tell users nothing.
          # Syft reports zero components for inputs it cannot catalog, which is
          # how a silently-broken scan looks.
          node - <<'NODE'
          const { readFileSync } = require("node:fs");
          const bom = JSON.parse(readFileSync(process.env.SBOM, "utf8"));
          const libraries = (bom.components ?? []).filter((c) => c.type === "library");
          const names = new Set(libraries.map((component) => component.name));
          const expected = [
            "@agentclientprotocol/claude-agent-acp",
            "@agentclientprotocol/codex-acp",
            "@agentclientprotocol/sdk",
          ];
          const missing = expected.filter((name) => !names.has(name));
          const forbidden = ["@stryker-mutator/core", "oxlint", "vite"].filter((name) =>
            names.has(name),
          );
          if (libraries.length === 0 || missing.length > 0 || forbidden.length > 0) {
            console.error(
              `Invalid production SBOM: ${libraries.length} libraries; ` +
                `missing=${missing.join(",") || "none"}; ` +
                `dev-only=${forbidden.join(",") || "none"}.`,
            );
            process.exit(1);
          }
          console.log(`SBOM: ${libraries.length} libraries.`);
          NODE

      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Attest SBOM
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}
          sbom-path: ${{ steps.pack.outputs.tarball }}.cdx.json

      # `--provenance` is npm's own attestation, recorded in the registry and
      # verifiable with `npm audit signatures`. It is separate from the GitHub
      # attestations above, which cover the same bytes and are verifiable with
      # `gh attestation verify`. Both are kept: they have different trust roots
      # and different audiences.
      - name: Publish
        run: npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance
